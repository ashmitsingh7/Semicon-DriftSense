# Localization/Inference Configuration
# Applied Materials Drift-Sense Problem Statement
# V1 Production (two-stage NCC) + V5 Gated Phase Reranker

# Nominal geometry
geometry:
  nominal_downsample: 10.0      # 100x ref / 10x search
  nominal_side_min: 6           # minimum template side in search pixels

# Stage 1: Coarse Global Search
stage1_coarse:
  # Single nominal-scale, zero-rotation NCC over full search image
  template_interpolation: "INTER_AREA"
  denoise_sigma: 0.6            # mild Gaussian blur before NCC
  ambiguity:
    exclude_radius_factor: 0.5  # exclude_radius = max(3, nominal_side/2)
    confidence_threshold: 0.35
    ambiguity_ratio_threshold: 1.05

# Stage 2: Fine Local Refinement
stage2_fine:
  window_radius_factor: 2.5     # window_r = int(nominal_side * 2.5) + 10
  window_margin: 10
  scale_search: [0.92, 0.96, 1.0, 1.04, 1.08]  # scale multipliers
  rot_search_deg: [-4, -2.5, -1, 0, 1, 2.5, 4] # rotation grid
  subpixel_method: "parabolic"  # Tian & Huhns 1986

# V2 Candidate Pool (for gated reranker input)
v2_candidates:
  K: 40                         # top-K coarse peaks
  nms_radius_factor: 0.5        # nms_radius = max(3, nominal_side // 2)
  dedup_radius_factor: 1.0      # dedup_radius = nominal_side (after refinement)
  # dedup runs on REFINED coordinates, not coarse (critical fix)

# V5 Gated Phase Reranker
gated_reranker:
  # Dual gating conditions (both must pass)
  min_template_side: 60         # only FinFET (~100px), not DRAM (~30px)
  score_margin_threshold: 0.01  # only when V2 top-2 margin < 1%

  # Phase correlation settings
  phase:
    use_hann_window: true
    window_type: "hanning"      # cv2.createHanningWindow
  # Execution: only on gated candidates (typically 0-5 candidates)

# V3 Native Verification (self-eval only, not production)
native_verifier:
  k_verify: 3                   # top-K V2 candidates to verify
  roi_half_size_mult: 1.3       # ROI = ref_side * 1.3 / 2 + 50
  scale_search: [0.97, 1.0, 1.03]
  rot_search_deg: [-3, -1.5, 0, 1.5, 3]
  noise_simulation:
    blur_sigma: 0.8
    dose_scale: 1.0
  # REQUIRES: style + seed (to regenerate canvas) - self-eval ONLY

# Output formatting
output:
  coordinate_precision: 2       # round to 2 decimal places
  confidence_precision: 4
  ambiguity_precision: 3

# Problem statement compliance
compliance:
  output_format:
    - "x"                       # search-image pixel x
    - "y"                       # search-image pixel y
    - "confidence"              # [0,1] NCC score
    - "ambiguity_ratio"         # peak/2nd_peak ratio
    - "scale"                   # estimated downsample ratio
    - "rotation_deg"            # estimated rotation
    - "low_confidence_flag"     # bool (confidence<0.35 or ambiguity<1.05)
  coordinate_convention: "top-left origin (0,0), x right, y down"
  multiple_matches_rule: "closest to search-image center"